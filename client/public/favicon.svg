<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  
  <!-- Inner subtle border highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Brain Circuit Network Path -->
  <g stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center spine -->
    <path d="M16 6.5v19" />
    
    <!-- Left hemisphere curves & synapses -->
    <path d="M16 6.5c-2.8 0-4.8 1.6-5.2 3.8C8.5 10.8 7 12.5 7 14.8c0 1.4.6 2.6 1.5 3.5-.7.8-1.1 1.8-1.1 2.9 0 2.6 2.2 4.6 5 4.6 1.3 0 2.5-.5 3.6-1.3" />
    
    <!-- Right hemisphere curves & synapses -->
    <path d="M16 6.5c2.8 0 4.8 1.6 5.2 3.8 2.3.5 3.8 2.2 3.8 4.5 0 1.4-.6 2.6-1.5 3.5.7.8 1.1 1.8 1.1 2.9 0 2.6-2.2 4.6-5 4.6-1.3 0-2.5-.5-3.6-1.3" />
    
    <!-- Synaptic bridge nodes -->
    <path d="M11 15h10" />
  </g>
  
  <!-- Neural Node Points -->
  <circle cx="16" cy="6.5" r="1.5" fill="#ffffff" />
  <circle cx="16" cy="25.5" r="1.5" fill="#ffffff" />
  <circle cx="11" cy="15" r="1.2" fill="#ffffff" />
  <circle cx="21" cy="15" r="1.2" fill="#ffffff" />
</svg>
